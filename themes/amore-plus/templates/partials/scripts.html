<script>
    // declaraction of document.ready() function.
    (function () {
        var ie = !!(window.attachEvent && !window.opera);
        var wk = /webkit\/(\d+)/i.test(navigator.userAgent) && (RegExp.$1 < 525);
        var fn = [];
        var run = function () {
            for (var i = 0; i < fn.length; i++) fn[i]();
        };
        var d = document;
        d.ready = function (f) {
            if (!ie && !wk && d.addEventListener)
                return d.addEventListener('DOMContentLoaded', f, false);
            if (fn.push(f) > 1) return;
            if (ie)
                (function () {
                    try {
                        d.documentElement.doScroll('left');
                        run();
                    } catch (err) {
                        setTimeout(arguments.callee, 0);
                    }
                })();
            else if (wk)
                var t = setInterval(function () {
                    if (/^(loaded|complete)$/.test(d.readyState))
                        clearInterval(t), run();
                }, 0);
        };
    })();


    document.ready(
        function () {
            var _Blog = window._Blog || {};

            const getSystemTheme = () => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }
                return 'light';
            };

            const configDefault = '{{ theme_config.defaultTheme|default:"" }}';
            const currentTheme = window.localStorage && window.localStorage.getItem('theme');
            const initialTheme = currentTheme || configDefault || getSystemTheme();
            const isDark = initialTheme === 'dark';

            const updateButtons = (dark) => {
                const sunBtn = document.getElementById("theme-toggle-sun");
                const moonBtn = document.getElementById("theme-toggle-moon");
                const mobileSunBtn = document.getElementById("mobile-theme-toggle-sun");
                const mobileMoonBtn = document.getElementById("mobile-theme-toggle-moon");

                if (dark) {
                    if (sunBtn) sunBtn.style.display = 'none';
                    if (moonBtn) moonBtn.style.display = 'inline-block';
                    if (mobileSunBtn) mobileSunBtn.style.display = 'none';
                    if (mobileMoonBtn) mobileMoonBtn.style.display = 'inline-block';
                } else {
                    if (sunBtn) sunBtn.style.display = 'inline-block';
                    if (moonBtn) moonBtn.style.display = 'none';
                    if (mobileSunBtn) mobileSunBtn.style.display = 'inline-block';
                    if (mobileMoonBtn) mobileMoonBtn.style.display = 'none';
                }
            };

            const updateThemeColor = (dark) => {
                const themeColor = dark ? '#292a2d' : '#ffffff';
                const metaTags = document.querySelectorAll('meta[name="theme-color"]');
                if (metaTags.length > 0) {
                    // 保留第一个，移除其他的，避免重复
                    for (let i = 1; i < metaTags.length; i++) {
                        metaTags[i].remove();
                    }
                    metaTags[0].setAttribute('content', themeColor);
                    metaTags[0].removeAttribute('media');
                } else {
                    const meta = document.createElement('meta');
                    meta.name = 'theme-color';
                    meta.content = themeColor;
                    document.head.appendChild(meta);
                }
            };

            const applyTheme = (dark) => {
                const body = document.getElementsByTagName('body')[0];
                if (dark) {
                    body.classList.add('dark-theme');
                } else {
                    body.classList.remove('dark-theme');
                }
                updateButtons(dark);
                updateThemeColor(dark);
            };

            // Initial application
            applyTheme(isDark);
            if (!currentTheme) {
                window.localStorage && window.localStorage.setItem('theme', initialTheme);
            }

            _Blog.toggleTheme = function () {
                const toggleFunc = (e) => {
                    // Prevent bubbling if needed, though buttons are distinct now
                    if (e) e.stopPropagation();

                    const body = document.getElementsByTagName('body')[0];
                    const isCurrentlyDark = body.classList.contains('dark-theme');

                    if (isCurrentlyDark) {
                        body.classList.remove('dark-theme');
                        updateButtons(false);
                        window.localStorage && window.localStorage.setItem('theme', 'light');
                    } else {
                        body.classList.add('dark-theme');
                        updateButtons(true);
                        window.localStorage && window.localStorage.setItem('theme', 'dark');
                    }
                };

                const sunBtn = document.getElementById("theme-toggle-sun");
                const moonBtn = document.getElementById("theme-toggle-moon");
                const mobileSunBtn = document.getElementById("mobile-theme-toggle-sun");
                const mobileMoonBtn = document.getElementById("mobile-theme-toggle-moon");

                if (sunBtn) sunBtn.addEventListener('click', toggleFunc);
                if (moonBtn) moonBtn.addEventListener('click', toggleFunc);
                if (mobileSunBtn) mobileSunBtn.addEventListener('click', toggleFunc);
                if (mobileMoonBtn) mobileMoonBtn.addEventListener('click', toggleFunc);
            };
            _Blog.toggleTheme();

            if (window.matchMedia && !configDefault) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    const newTheme = e.matches ? 'dark' : 'light';
                    applyTheme(e.matches);
                    window.localStorage && window.localStorage.setItem('theme', newTheme);
                });
            }
        }
    );
</script>

<script>
    // Reading Progress Component: 页面顶部细线
    document.addEventListener('DOMContentLoaded', () => {
        const bar = document.querySelector('.reading-progress-bar');
        const fill = document.querySelector('.reading-progress-bar__fill');

        // Exit if elements don't exist (e.g., not on a post page)
        if (!bar || !fill) {
            return;
        }

        let ticking = false;
        let lastRatio = -1;

        function setProgress(ratio) {
            const safeRatio = Math.min(1, Math.max(0, ratio));
            if (Math.abs(safeRatio - lastRatio) < 0.001) {
                return;
            }
            lastRatio = safeRatio;
            // 用 scaleX 表示进度：走 GPU 合成，不触发重排（比改 width 性能好）
            fill.style.transform = `scaleX(${safeRatio})`;
            bar.setAttribute('aria-valuenow', String(Math.round(safeRatio * 100)));
        }

        function update() {
            const scrollEl = document.scrollingElement || document.documentElement;
            const scrollTop = scrollEl.scrollTop;
            const scrollable = scrollEl.scrollHeight - window.innerHeight;

            if (scrollable <= 0) {
                // 内容不足一屏：无可滚动距离，进度恒为 0
                setProgress(0);
                return;
            }

            setProgress(scrollTop / scrollable);
        }

        function onScroll() {
            if (ticking) {
                return;
            }
            ticking = true;
            window.requestAnimationFrame(() => {
                update();
                ticking = false;
            });
        }

        // Initialize
        update();

        // Listen for scroll events
        window.addEventListener('scroll', onScroll, { passive: true });

        // Recalculate on resize (viewport height changes the scrollable range)
        window.addEventListener('resize', onScroll);
    });
</script>

<script>
  // Table of Contents (TOC) generator
  document.addEventListener('DOMContentLoaded', () => {
    const content = document.querySelector('.mod-post__entry');
    const tocList = document.querySelector('.toc-list');
    const tocAside = document.getElementById('toc');

    if (!content || !tocList || !tocAside) {
      return;
    }

    const headings = content.querySelectorAll('h2, h3');
    if (headings.length === 0) {
      tocAside.style.display = 'none';
      return;
    }

    const links = [];
    headings.forEach((heading, index) => {
      if (!heading.id) {
        heading.id = 'toc-heading-' + index;
      }
      const level = heading.tagName.toLowerCase() === 'h3' ? 'toc-h3' : '';
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + heading.id;
      a.className = 'toc-link ' + level;
      a.textContent = heading.textContent.trim();
      li.appendChild(a);
      tocList.appendChild(li);
      links.push(a);
    });

    // 当前章节判定：以「阅读线」（视口顶部往下 22%）为界，取最后一个越线的标题
    const readingLine = () => Math.max(80, Math.round(window.innerHeight * 0.22));

    // -1 表示尚未进入任何章节（此时不高亮任何目录项）
    let activeIndex = -1;
    let ticking = false;

    // ── 目录面板跟随滚动 ────────────────────────────────────────
    // 面板高度不足以容纳全部目录项时（overflow-y: auto），焦点项需自行保持在可视范围内。
    const panel = tocAside;

    // 移动距离不超过该值时直接跳到目标位置，超过则平滑滚动：
    // 逐节滚动多为小幅移动（瞬时更跟手），点击目录跳转多为大幅移动（平滑更自然）
    const INSTANT_THRESHOLD = 120;

    // 用户手动翻过目录后让位，直到文章再次滚动才恢复跟随
    let userScrolledPanel = false;
    const markPanelUserScroll = () => {
        userScrolledPanel = true;
    };
    panel.addEventListener('wheel', markPanelUserScroll, { passive: true });
    panel.addEventListener('touchmove', markPanelUserScroll, { passive: true });

    const followActive = () => {
        if (userScrolledPanel || activeIndex < 0) {
            return;
        }
        // 目录未超出面板高度时无从滚动
        if (panel.scrollHeight <= panel.clientHeight) {
            return;
        }
        const link = links[activeIndex];
        if (!link) {
            return;
        }

        // 焦点项中心与面板中心的偏差。
        // 只改 scrollTop，不使用 scrollIntoView —— 后者会连带滚动外层页面把正文顶走。
        const linkRect = link.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        const delta = (linkRect.top + linkRect.height / 2) - (panelRect.top + panel.clientHeight / 2);

        const maxScroll = panel.scrollHeight - panel.clientHeight;
        const target = Math.max(0, Math.min(panel.scrollTop + delta, maxScroll));
        const distance = target - panel.scrollTop;
        if (Math.abs(distance) < 1) {
            return;
        }

        if (Math.abs(distance) <= INSTANT_THRESHOLD) {
            panel.scrollTop = target;
        } else {
            panel.scrollTo({ top: target, behavior: 'smooth' });
        }
    };

    const updateActive = () => {
        const line = readingLine();
        let next = -1;
        headings.forEach((heading, index) => {
            if (heading.getBoundingClientRect().top <= line) {
                next = index;
            }
        });

        // 已滚到文档底部：强制高亮最后一项。
        // 末章节距文档末尾往往不足阈值高度，否则它永远无法激活。
        const scrollEl = document.scrollingElement || document.documentElement;
        if (scrollEl.scrollTop + window.innerHeight >= scrollEl.scrollHeight - 2) {
            next = headings.length - 1;
        }

        if (next === activeIndex) {
            return;
        }
        activeIndex = next;
        links.forEach((link, index) => {
            link.classList.toggle('active', index === activeIndex);
        });
    };

    const onScroll = () => {
        if (ticking) {
            return;
        }
        ticking = true;
        window.requestAnimationFrame(() => {
            updateActive();
            followActive();
            ticking = false;
        });
    };

    updateActive();
    followActive();
    window.addEventListener('scroll', () => {
        // 文章再次滚动 → 恢复目录自动跟随
        userScrolledPanel = false;
        onScroll();
    }, { passive: true });
    // 窗口尺寸变化会改变阅读线位置、面板高度与标题偏移，需重算
    window.addEventListener('resize', onScroll);
    // 点击目录锚点跳转后（hash 变化未必触发 scroll）同步一次
    window.addEventListener('hashchange', onScroll);
});
</script>
