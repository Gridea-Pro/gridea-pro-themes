<nav class="sc-pagination" role="navigation" aria-label="分页">
  {% if pagination.prev %}<a href="{{ pagination.prev }}" rel="prev">上一页</a>{% endif %}
  <span class="sc-pagination-meta">
    当前页码：{{ pagination.currentPage|default:1 }}
    {% if pagination.totalPages %} · 总页码：{{ pagination.totalPages }}{% endif %}
  </span>
  {% if pagination.next %}<a href="{{ pagination.next }}" rel="next">下一页</a>{% endif %}
</nav>
