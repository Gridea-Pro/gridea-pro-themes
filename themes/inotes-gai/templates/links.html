<html>

<head>
    {{template "head" .}}
    <meta name="description" content="{{or .Site.CustomConfig.metaDescription .ThemeConfig.SiteDescription}}" />
    <style>
        .links-page {
            flex: 1;
            padding: 8px 0 32px;
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            padding: 8px 0 24px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        .link-card:hover {
            border-color: #006CFF;
            box-shadow: 0 4px 16px rgba(0, 108, 255, 0.12);
            transform: translateY(-2px);
        }

        .link-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #f1f3f5;
        }

        .link-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .link-name {
            font-size: 16px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.86);
        }

        .link-desc {
            margin-top: 4px;
            font-size: 13px;
            line-height: 1.5;
            color: #868e96;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .links-empty {
            text-align: center;
            color: #868e96;
            font-size: 14px;
            padding: 48px 0;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="main-content">
            {{template "header" .}}

            <div class="links-page">

                <div class="links-container">
                    {{range .Site.CustomConfig.links}}
                    <a class="link-card" href="{{.siteLink}}" target="_blank" rel="noopener">
                        {{if .avatar}}
                        <img class="link-avatar" src="{{.avatar}}" alt="{{.siteName}}">
                        {{end}}
                        <div class="link-info">
                            <span class="link-name">{{.siteName}}</span>
                            {{if .description}}
                            <span class="link-desc">{{.description}}</span>
                            {{end}}
                        </div>
                    </a>
                    {{end}}
                </div>

                {{if not .Site.CustomConfig.links}}
                <p class="links-empty">暂无友链，去 Gridea Pro 的「链接」里添加后重新发布即可。</p>
                {{end}}
            </div>

            {{template "footer" .}}
        </div>
    </div>
</body>

</html>
