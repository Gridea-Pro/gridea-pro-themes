{# partials/pagination.html — 分页导航 #}
{% if pagination.prev or pagination.next %}
<div class="pagination-container">
  {% if pagination.prev %}<a href="{{ pagination.prev }}" class="prev-page">上一页</a>{% endif %}
  {% if pagination.next %}<a href="{{ pagination.next }}" class="next-page">下一页</a>{% endif %}
</div>
{% endif %}
