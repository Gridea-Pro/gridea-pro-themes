<div class="weather-widget">
  <div class="weather-icon">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="12"/><path d="M32 8v4M32 52v4M8 32h4M52 32h4M14.3 14.3l2.8 2.8M46.9 46.9l2.8 2.8M14.3 49.7l2.8-2.8M46.9 17.1l2.8-2.8"/>
    </svg>
  </div>
  <div class="weather-info">
    <span class="weather-temp" id="weather-temp">--&deg;C</span>
    <span class="weather-desc" id="weather-desc">获取中...</span>
  </div>
</div>
<script>
(function(){
  var tempEl = document.getElementById('weather-temp');
  var descEl = document.getElementById('weather-desc');
  if(!tempEl || !descEl) return;
  if(!navigator.geolocation){
    tempEl.textContent = '--°C';
    descEl.textContent = '定位不可用';
    return;
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude;
    var lon = pos.coords.longitude;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true&timezone=auto';
    fetch(url).then(function(r){return r.json()}).then(function(d){
      if(d.current_weather){
        tempEl.textContent = d.current_weather.temperature + '°C';
        var code = d.current_weather.weathercode;
        var desc = '';
        if(code<=1) desc = '晴';
        else if(code<=3) desc = '多云';
        else if(code<=48) desc = '雾';
        else if(code<=57) desc = '毛毛雨';
        else if(code<=67) desc = '雨';
        else if(code<=77) desc = '雪';
        else if(code<=82) desc = '阵雨';
        else if(code<=86) desc = '阵雪';
        else desc = '强天气';
        descEl.textContent = desc;
      }
    }).catch(function(){
      tempEl.textContent = '--°C';
      descEl.textContent = '获取失败';
    });
  }, function(){
    tempEl.textContent = '--°C';
    descEl.textContent = '定位拒绝';
  });
})();
</script>
