<article class="post-card">
  <h2 class="post-card-title">
    <a href="{{ post.link }}">
      {{ post.title }}
    </a>
  </h2>
  <div class="post-card-meta">
    <time class="post-card-date">{{ post.dateFormat }}</time>
    {% if post.tags %}
      <span class="post-card-tags">
        {% for tag in post.tags %}
          <a href="{{ tag.link }}" class="post-card-tag">{{ tag.name }}</a>
        {% endfor %}
      </span>
    {% endif %}
    {% if theme_config.showEstimatedReadingTime %}
      <span class="post-card-reading-time">阅读本文约需一段时间</span>
    {% endif %}
  </div>
  {% if post.content %}
    <p class="post-card-excerpt">{{ post.content|striptags|truncatechars:250 }}</p>
  {% endif %}
</article>
