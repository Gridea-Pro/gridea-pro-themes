<header class="header">
  <div class="container header-inner">
    <div class="header-brand">
      <a href="/" class="header-logo">
        {% if config.logo %}
          <img src="{{ config.logo }}" alt="{{ config.siteName }}" class="header-logo-img">
        {% else %}
          {{ config.siteName }}
        {% endif %}
      </a>
    </div>
    <nav class="header-nav" id="header-nav">
      {% for menu in menus %}
        <a href="{{ menu.link }}" class="header-nav-link">{{ menu.name }}</a>
      {% endfor %}
    </nav>
    <div class="header-actions">
      {% if theme_config.showSearch %}
        <button class="search-toggle" id="search-toggle" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
      {% endif %}
      {% if theme_config.showDarkModeToggle %}
        <button class="theme-toggle" id="theme-toggle" aria-label="切换暗色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      {% endif %}
    </div>
    <button class="menu-toggle" id="menu-toggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
