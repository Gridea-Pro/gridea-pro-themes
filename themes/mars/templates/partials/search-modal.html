<div class="search-modal" id="search-modal">
  <div class="search-modal-content">
    <form class="search-form" action="/search/" method="GET" role="search">
      <span class="search-prompt">$ search</span>
      <input class="search-input" type="text" name="q" placeholder="输入关键词..." aria-label="搜索" autofocus>
    </form>
    <button class="search-modal-close" id="search-modal-close" aria-label="关闭">ESC</button>
  </div>
</div>
