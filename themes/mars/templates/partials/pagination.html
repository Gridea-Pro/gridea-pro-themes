{% if pagination.prev or pagination.next %}
<nav class="pagination">
  {% if pagination.prev %}
    <a href="{{ pagination.prev }}" class="pagination-link pagination-prev">&larr; 上一页</a>
  {% endif %}
  {% if pagination.next %}
    <a href="{{ pagination.next }}" class="pagination-link pagination-next">下一页 &rarr;</a>
  {% endif %}
</nav>
{% endif %}
