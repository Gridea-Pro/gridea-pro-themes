{# Full-screen search modal. Triggered by:
   • header search button on mobile
   • desktop "filter strip" Enter key
   • "/" key
   • Cmd+K / Ctrl+K
   Reads /api/search.json (auto-generated by Gridea Pro). #}
<div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
  <div class="search-modal-panel" role="document">
    <span id="search-modal-title" class="visually-hidden">搜索</span>
    <input class="search-modal-input" id="search-modal-input" type="search" placeholder="搜索文章 / 标签 / 内容…" autocomplete="off">
    <p class="search-modal-tip">↑ ↓ 选择 · Enter 进入 · Esc 关闭 · / 唤起 · Cmd+K / Ctrl+K 唤起</p>
    <div class="search-modal-results" id="search-modal-results"></div>
    <div class="search-modal-empty" style="display:none"></div>
  </div>
  <button type="button" class="search-modal-close" data-action="close-search" aria-label="关闭搜索">×</button>
</div>
