<div id="giscus-container"></div>
<script>
  (function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.setAttribute('data-repo', '{{ commentSetting.repo }}');
    s.setAttribute('data-repo-id', '{{ commentSetting.repoId }}');
    s.setAttribute('data-category', '{{ commentSetting.category }}');
    s.setAttribute('data-category-id', '{{ commentSetting.categoryId }}');
    s.setAttribute('data-mapping', 'pathname');
    s.setAttribute('data-strict', '0');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', 'top');
    s.setAttribute('data-theme', isDark ? 'dark' : 'light');
    s.setAttribute('data-lang', 'zh-CN');
    document.getElementById('giscus-container').appendChild(s);
  })();
</script>
