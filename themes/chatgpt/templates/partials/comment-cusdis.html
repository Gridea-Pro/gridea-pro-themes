<div id="cusdis_thread"
  data-host="{{ commentSetting.host }}"
  data-app-id="{{ commentSetting.appId }}"
  data-page-id="{{ post.fileName }}"
  data-page-url="{{ post.link }}"
  data-page-title="{{ post.title }}">
</div>
<script>
  // Cusdis 主题跟随当前深浅模式
  var cusdisEl = document.getElementById('cusdis_thread');
  if (cusdisEl) cusdisEl.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
</script>
<script async defer src="{{ commentSetting.host }}/js/cusdis.es.js"></script>
