{% extends "base.html" %}
{% block title %}分类 - {{ config.siteName }}{% endblock %}
{% block content %}

<div class="post__header">
  <div class="post__back">
    <svg class="back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    <a class="back__link" href="/">返回</a>
  </div>
  <h1 class="post__title">分类</h1>
</div>

<div class="tags-page">
  <h2 class="tags-page__title">全部分类 · 共 {{ categories|length }} 个</h2>
  
  <div class="tags-cloud">
    {% for category in categories %}
    <a href="{{ category.link }}" class="tag-chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      {{ category.name }}
      <span class="tag-chip__count">{{ category.count|default:0 }}</span>
    </a>
    {% endfor %}
  </div>
</div>

{% endblock %}
